name: Unit tests

on:
  push:
    branches: [main, paper-aligned-reproduction]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run selector contract tests
        run: python -m unittest discover -s tests -v
