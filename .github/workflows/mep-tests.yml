name: MEP selector tests

on:
  push:
    branches: [main]
    paths:
      - "MEP/**"
      - ".github/workflows/mep-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "MEP/**"
      - ".github/workflows/mep-tests.yml"

jobs:
  selector-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MEP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run selector contract tests
        run: python -m unittest discover -s tests -v
